name: CI

on:
  push:
    branches: [master, main, 'feature/**']
  pull_request:

jobs:
  qa:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install QA tools
        working-directory: dev/qa
        run: composer install --no-interaction --prefer-dist

      - name: PHPUnit
        run: dev/qa/vendor/bin/phpunit --testsuite unit

      - name: PHPStan
        run: dev/qa/vendor/bin/phpstan analyse --memory-limit=1G

      - name: PHPCS
        run: dev/qa/vendor/bin/phpcs --standard=.phpcs.xml
